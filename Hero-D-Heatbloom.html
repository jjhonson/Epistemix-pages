<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero D: Heat Bloom (density landscape)</title>
<style>
  :root { --blue: #4056F4; --bg: #F6F6F6; --text: #141414; --muted: #595959; --hint: #9ca0a8; }
  body.dark { --bg: #141414; --text: #F6F6F6; --muted: #b9bcc4; --hint: #5a5d66; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; transition: background 0.3s; }
  #field { position: fixed; inset: 0; display: block; }
  .scrim { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 46% 36% at 50% 36%,
      rgba(246,246,246,0.94) 0%, rgba(246,246,246,0.72) 55%, rgba(246,246,246,0) 100%); }
  body.dark .scrim {
    background: radial-gradient(ellipse 46% 36% at 50% 36%,
      rgba(20,20,20,0.94) 0%, rgba(20,20,20,0.72) 55%, rgba(20,20,20,0) 100%); }
  .hero { position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start; text-align: center;
    pointer-events: none; padding: 15vh 8vw 0; }
  h1 { font-weight: 300; font-size: clamp(40px, 6vw, 72px); line-height: 1.1;
    color: var(--text); margin: 0 0 22px; letter-spacing: -0.01em; max-width: 18ch; }
  p.sub { font-weight: 400; font-size: clamp(15px, 1.4vw, 19px); color: var(--muted);
    margin: 0 0 34px; max-width: 52ch; line-height: 1.5; }
  .cta { pointer-events: auto; display: inline-block; background: var(--blue);
    color: #fff; text-decoration: none; font-size: 14px; padding: 12px 26px;
    border-radius: 9999px; }
  .hint { position: fixed; bottom: 18px; width: 100%; text-align: center;
    color: var(--hint); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }
</style>
</head>
<body>
<canvas id="field"></canvas>
<div class="scrim"></div>
<div class="hero">
  <h1>A world model built for the decisions that shape your market</h1>
  <p class="sub">Every person, every business, every network, and all the forces that connect them.</p>
  <a class="cta" href="#">Learn More</a>
</div>
<div class="hint">D: Heat Bloom &nbsp;·&nbsp; Click to expose a hidden region &nbsp;·&nbsp; Press B for light / dark</div>

<script>
(() => {
  const canvas = document.getElementById('field');
  const ctx = canvas.getContext('2d');
  let W, H;

  const PALETTE = [[64,86,244],[212,145,91],[77,182,172],[28,48,128]];
  const WEIGHTS = [0.45, 0.25, 0.2, 0.1];
  const pick = () => { let r = Math.random(); for (let i = 0; i < 4; i++) { if ((r -= WEIGHTS[i]) <= 0) return PALETTE[i]; } return PALETTE[0]; };
  const isDark = () => document.body.classList.contains('dark');
  const palette = () => isDark() ? { base: [150,158,182], dotA: 0.30 } : { base: [110,116,134], dotA: 0.38 };
  addEventListener('keydown', e => { if (e.key.toLowerCase() === 'b') document.body.classList.toggle('dark'); });

  let dots = [];
  let safe = { cx: 0, cy: 0, rx: 1, ry: 1 };
  const inSafe = (x, y, m = 1) => {
    const dx = (x - safe.cx) / (safe.rx * m), dy = (y - safe.cy) / (safe.ry * m);
    return dx * dx + dy * dy < 1;
  };

  function resize() {
    const DPR = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    safe = { cx: W / 2, cy: H * 0.36, rx: Math.min(W * 0.30, 470), ry: Math.min(H * 0.30, 300) };
    dots = [];
    const s = 20;
    for (let gy = s / 2; gy < H; gy += s) for (let gx = s / 2; gx < W; gx += s)
      dots.push({ x: gx + (Math.random() - .5) * s * .85, y: gy + (Math.random() - .5) * s * .85,
                  r: .9 + Math.random() * .8, n: 0.65 + Math.random() * 0.7 }); // per-dot noise = organic edges
  }

  // --- heat blooms: a hidden density landscape becomes visible, then recedes ---
  const GROW = 2600, HOLD = 3200, FADE = 2600;
  let blooms = [];

  function spawn(x, y) {
    // 2-3 overlapping lobes make the shape organic rather than circular
    const lobes = [{ dx: 0, dy: 0, r: 130 + Math.random() * 80 }];
    const n = 1 + (Math.random() * 2) | 0;
    for (let i = 0; i < n; i++) {
      const ang = Math.random() * Math.PI * 2, dist = 80 + Math.random() * 110;
      lobes.push({ dx: Math.cos(ang) * dist, dy: Math.sin(ang) * dist, r: 90 + Math.random() * 70 });
    }
    blooms.push({ x, y, lobes, t0: performance.now(), col: pick() });
  }
  function randomSpawn() {
    for (let t = 0; t < 50; t++) {
      const x = 100 + Math.random() * (W - 200), y = 100 + Math.random() * (H - 200);
      if (!inSafe(x, y, 1.2)) return spawn(x, y);
    }
  }
  addEventListener('pointerdown', e => spawn(e.clientX, e.clientY));

  let lastAuto = 0;
  function frame(now) {
    ctx.clearRect(0, 0, W, H);
    const P = palette();

    if (now - lastAuto > 7000 && blooms.length < 2) { randomSpawn(); lastAuto = now; }
    blooms = blooms.filter(b => now - b.t0 < GROW + HOLD + FADE);

    for (const d of dots) {
      let a = 0, col = PALETTE[0];
      for (const b of blooms) {
        const el = now - b.t0;
        let env, scale;
        if (el < GROW) { env = el / GROW; scale = 0.35 + 0.65 * (el / GROW); }
        else if (el < GROW + HOLD) { env = 1; scale = 1; }
        else { env = Math.max(0, 1 - (el - GROW - HOLD) / FADE); scale = 1; }
        let v = 0;
        for (const L of b.lobes) {
          const dist = Math.hypot(d.x - (b.x + L.dx), d.y - (b.y + L.dy));
          const rr = L.r * scale;
          v = Math.max(v, Math.exp(-(dist * dist) / (2 * rr * rr)));
        }
        const contrib = Math.min(1, v * d.n) * env;
        if (contrib > a) { a = contrib; col = b.col; }
      }
      const dim = inSafe(d.x, d.y) ? 0.4 : 1;
      if (a > 0.06) {
        ctx.fillStyle = `rgba(${col[0]},${col[1]},${col[2]},${(0.15 + 0.85 * a) * dim})`;
        ctx.beginPath(); ctx.arc(d.x, d.y, d.r + 1.3 * a, 0, 7); ctx.fill();
      } else {
        ctx.fillStyle = `rgba(${P.base[0]},${P.base[1]},${P.base[2]},${P.dotA * dim})`;
        ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 7); ctx.fill();
      }
    }
    requestAnimationFrame(frame);
  }

  addEventListener('resize', resize);
  resize();
  setTimeout(randomSpawn, 1000);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
