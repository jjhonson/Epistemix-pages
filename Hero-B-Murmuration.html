<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero B: Murmuration (coherent motion)</title>
<style>
  :root { --blue: #4056F4; --bg: #F6F6F6; --text: #141414; --muted: #595959; --hint: #9ca0a8; }
  body.dark { --bg: #141414; --text: #F6F6F6; --muted: #b9bcc4; --hint: #5a5d66; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; transition: background 0.3s; }
  #field { position: fixed; inset: 0; display: block; }
  .scrim { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 46% 36% at 50% 36%,
      rgba(246,246,246,0.94) 0%, rgba(246,246,246,0.72) 55%, rgba(246,246,246,0) 100%); }
  body.dark .scrim {
    background: radial-gradient(ellipse 46% 36% at 50% 36%,
      rgba(20,20,20,0.94) 0%, rgba(20,20,20,0.72) 55%, rgba(20,20,20,0) 100%); }
  .hero { position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start; text-align: center;
    pointer-events: none; padding: 15vh 8vw 0; }
  h1 { font-weight: 300; font-size: clamp(40px, 6vw, 72px); line-height: 1.1;
    color: var(--text); margin: 0 0 22px; letter-spacing: -0.01em; max-width: 18ch; }
  p.sub { font-weight: 400; font-size: clamp(15px, 1.4vw, 19px); color: var(--muted);
    margin: 0 0 34px; max-width: 52ch; line-height: 1.5; }
  .cta { pointer-events: auto; display: inline-block; background: var(--blue);
    color: #fff; text-decoration: none; font-size: 14px; padding: 12px 26px;
    border-radius: 9999px; }
  .hint { position: fixed; bottom: 18px; width: 100%; text-align: center;
    color: var(--hint); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }
</style>
</head>
<body>
<canvas id="field"></canvas>
<div class="scrim"></div>
<div class="hero">
  <h1>A world model built for the decisions that shape your market</h1>
  <p class="sub">Every person, every business, every network, and all the forces that connect them.</p>
  <a class="cta" href="#">Learn More</a>
</div>
<div class="hint">B: Murmuration &nbsp;·&nbsp; Click to start a movement &nbsp;·&nbsp; Press B for light / dark</div>

<script>
(() => {
  const canvas = document.getElementById('field');
  const ctx = canvas.getContext('2d');
  let W, H;

  const PALETTE = [[64,86,244],[212,145,91],[77,182,172],[28,48,128]];
  const WEIGHTS = [0.45, 0.25, 0.2, 0.1];
  const pick = () => { let r = Math.random(); for (let i = 0; i < 4; i++) { if ((r -= WEIGHTS[i]) <= 0) return PALETTE[i]; } return PALETTE[0]; };
  const isDark = () => document.body.classList.contains('dark');
  const palette = () => isDark() ? { base: [150,158,182], dotA: 0.30 } : { base: [110,116,134], dotA: 0.38 };
  addEventListener('keydown', e => { if (e.key.toLowerCase() === 'b') document.body.classList.toggle('dark'); });

  let dots = [];
  let safe = { cx: 0, cy: 0, rx: 1, ry: 1 };
  const inSafe = (x, y, m = 1) => {
    const dx = (x - safe.cx) / (safe.rx * m), dy = (y - safe.cy) / (safe.ry * m);
    return dx * dx + dy * dy < 1;
  };

  function resize() {
    const DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    safe = { cx: W / 2, cy: H * 0.36, rx: Math.min(W * 0.30, 470), ry: Math.min(H * 0.30, 300) };
    dots = [];
    const s = 20;
    for (let gy = s / 2; gy < H; gy += s) for (let gx = s / 2; gx < W; gx += s)
      dots.push({
        ox: gx + (Math.random() - .5) * s * .85,
        oy: gy + (Math.random() - .5) * s * .85,
        r: .9 + Math.random() * .8,
        jw: .3 + Math.random() * .5,       // idle jitter speed
        jp: Math.random() * 6.283          // idle jitter phase
      });
  }

  // --- murmuration events: a region of the sea moves together, then dissolves ---
  const DUR = 7000, RAMP = 1400, OUT = 1800, RADIUS = 230, AMP = 15;
  let events = [];

  function spawn(x, y) {
    const dir = Math.random() * Math.PI * 2;
    events.push({
      x, y, t0: performance.now(),
      vx: Math.cos(dir) * 26, vy: Math.sin(dir) * 26,   // center drift px/s
      turn: (Math.random() - .5) * .5,                   // slow curving
      col: pick()
    });
  }
  function randomSpawn() {
    for (let t = 0; t < 50; t++) {
      const x = 80 + Math.random() * (W - 160), y = 80 + Math.random() * (H - 160);
      if (!inSafe(x, y, 1.15)) return spawn(x, y);
    }
  }
  addEventListener('pointerdown', e => spawn(e.clientX, e.clientY));

  let lastAuto = 0;
  function frame(now) {
    ctx.clearRect(0, 0, W, H);
    const P = palette();
    const t = now / 1000;

    if (now - lastAuto > 7500 && events.length < 2) { randomSpawn(); lastAuto = now; }
    events = events.filter(ev => now - ev.t0 < DUR);

    for (const d of dots) {
      // idle jitter: the sea is faintly alive
      const jx = 1.4 * Math.sin(t * d.jw * 6.283 + d.jp);
      const jy = 1.4 * Math.cos(t * d.jw * 5.1 + d.jp * 1.7);
      let mx = 0, my = 0, a = 0, col = PALETTE[0];

      for (const ev of events) {
        const el = now - ev.t0;
        let env;
        if (el < RAMP) env = el / RAMP;
        else if (el < DUR - OUT) env = 1;
        else env = Math.max(0, (DUR - el) / OUT);
        // moving center with gentle curve
        const ang = Math.atan2(ev.vy, ev.vx) + ev.turn * (el / 1000);
        const sp = Math.hypot(ev.vx, ev.vy);
        const cx = ev.x + Math.cos(ang) * sp * (el / 1000);
        const cy = ev.y + Math.sin(ang) * sp * (el / 1000);
        const dist = Math.hypot(d.ox - cx, d.oy - cy);
        const w = Math.exp(-(dist * dist) / (2 * RADIUS * RADIUS)) * env;
        if (w < 0.02) continue;
        // group velocity direction + slight swirl = common fate
        const swirl = Math.sin(el / 900 + dist / 90) * .5;
        const gx = Math.cos(ang + swirl), gy = Math.sin(ang + swirl);
        mx += gx * AMP * w;
        my += gy * AMP * w;
        if (w > a) { a = w; col = ev.col; }
      }

      const x = d.ox + jx + mx, y = d.oy + jy + my;
      const dim = inSafe(x, y) ? 0.4 : 1;
      if (a > 0.06) {
        const k = Math.min(a, 1);
        ctx.fillStyle = `rgba(${col[0]},${col[1]},${col[2]},${(0.25 + 0.7 * k) * dim})`;
        ctx.beginPath(); ctx.arc(x, y, d.r + 1.2 * k, 0, 7); ctx.fill();
      } else {
        ctx.fillStyle = `rgba(${P.base[0]},${P.base[1]},${P.base[2]},${P.dotA * dim})`;
        ctx.beginPath(); ctx.arc(x, y, d.r, 0, 7); ctx.fill();
      }
    }
    requestAnimationFrame(frame);
  }

  addEventListener('resize', resize);
  resize();
  setTimeout(randomSpawn, 1000);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
